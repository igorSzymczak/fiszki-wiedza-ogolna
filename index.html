<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Fiszki - Wiedza Ogólna</title>
</head>
<body>
  <div id="tag-panel" class="tag-panel">
    <button id="tag-panel-toggle">Tagi</button>
    <form id="tag-form">
      <div class="tag-panel-controls">
        <button type="button" id="select-all">Zaznacz wszystkie</button>
        <button type="button" id="select-sem2">Odznacz wszystkie</button>
      </div>
      <h3>Wybierz zagadnienia:</h3>
      <div id="tag-warning" style="color:var(--color-0);margin-bottom:8px;font-size:0.95em;display:none">Musisz zaznaczyć przynajmniej jedno zagadnienie!</div>
      <div id="tag-list"><!-- Tagi będą generowane dynamicznie --></div>
    </form>
  </div>
  <main>
    <h3 class="question_amount_container">
      Wiedza Ogólna (<span id="question_amount"></span> fiszek)
      <br>
      Pozostało pytań: <span id="remaining_flashcards"></span>
      <br>
      <button id="reset">Zresetuj pulę pytań</button>
    </h3>
    <h2 id="score"></h2>
    <h2 id="question">Wczytuję fiszki...</h2>
    <img src="./img/loading.gif" alt="" id="image">
    <div class="answer_container">
      <h2>Prawidlowa odpowiedz:</h2>
      <h3 id="answer"></h3>
      <br>
      <div class="explanation">
        <h2>Wyjasnienie:</h2>
        <h3 id="explanation"></h3>
      </div>
    </div>
    <div class="buttons_container">
      <button id="bad" class="bad"><span>Źle :(</span></button>
      <button id="good" class="good"><span>Dobrze :)</span></button>
    </div>
  </main>

  <script src="./script.js" type="module"></script>
</body>
</html>
